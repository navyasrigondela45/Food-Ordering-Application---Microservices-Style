services:
  postgres:
    image: postgres:15-alpine
    container_name: food-postgres
    environment:
      POSTGRES_DB: foodordering
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - food-ordering-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d foodordering"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    image: user-service
    container_name: user-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - JWT_SECRET=your-secret-key-change-in-production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=foodordering
      - DB_USER=admin
      - DB_PASSWORD=admin123
    depends_on:
      - postgres
    networks:
      - food-ordering-network
    restart: unless-stopped

  product-service:
    image: product-service
    container_name: product-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=foodordering
      - DB_USER=admin
      - DB_PASSWORD=admin123
    depends_on:
      - postgres
    networks:
      - food-ordering-network
    restart: unless-stopped

  order-service:
    image: order-service
    container_name: order-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=foodordering
      - DB_USER=admin
      - DB_PASSWORD=admin123
    depends_on:
      - postgres
      - user-service
      - product-service
    networks:
      - food-ordering-network
    restart: unless-stopped

networks:
  food-ordering-network:
    driver: bridge

volumes:
  postgres_data:
